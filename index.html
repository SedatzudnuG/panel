<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duvar Paneli</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#23211d;--mute:#8a857a;--acc:#d9622b;--line:#e8e3d8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:2vmin;display:flex;flex-direction:column;gap:2vmin;overflow:hidden}
main{flex:1;min-height:0}
.view{display:none;height:100%}
.view.on{display:grid}
#v-home{grid-template-columns:1.1fr 1.2fr 1fr;gap:2vmin}
.one{grid-template-columns:1fr;gap:2vmin}
.card{background:var(--card);border-radius:2vmin;padding:2.4vmin;box-shadow:0 1px 3px #0001;display:flex;flex-direction:column;min-height:0}
.left{gap:2vmin;background:none;box-shadow:none;padding:0}
.left .card{flex:1}
#time{font-size:min(13vw,20vh);font-weight:300;letter-spacing:-.03em;line-height:1}
#date{font-size:min(3vw,4vh);color:var(--mute);margin-top:1vmin}
.w-now{display:flex;align-items:center;gap:2vmin}
.w-ico{font-size:min(9vw,11vh)}
.w-temp{font-size:min(7vw,9vh);font-weight:300}
.w-desc{color:var(--mute);font-size:min(2.2vw,2.8vh)}
.days{display:flex;gap:1.5vmin;margin-top:auto}
.day{flex:1;text-align:center;background:var(--bg);border-radius:1.5vmin;padding:1.2vmin;font-size:min(2vw,2.4vh)}
.day b{display:block;font-weight:600}
.day span{color:var(--mute)}
h2{font-size:min(3vw,3.6vh);font-weight:600;margin-bottom:1.5vmin}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.6vmin;flex:1;min-height:0;text-align:center;align-content:stretch}
.cal .h{color:var(--mute);font-size:min(2vw,2.4vh);padding-bottom:.8vmin}
.cal .d{display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:min(2.6vw,3.2vh);aspect-ratio:1;max-height:100%;margin:auto;width:100%}
.cal .o{color:#c5c0b4}
.cal .t{background:var(--acc);color:#fff;font-weight:700}
button{font:inherit;border:0;cursor:pointer}
form{display:flex;gap:1vmin;margin-bottom:1.5vmin}
input[type=text]{flex:1;min-width:0;font-size:min(2.6vw,3vh);padding:1.4vmin 1.8vmin;border:2px solid var(--line);border-radius:1.5vmin;background:var(--bg);color:var(--ink)}
.add{background:var(--acc);color:#fff;font-size:min(3vw,3.6vh);border-radius:1.5vmin;padding:0 2.2vmin}
ul{list-style:none;padding:0;overflow:auto;flex:1}
li{display:flex;align-items:center;gap:1.4vmin;padding:1.5vmin 0;border-bottom:1px solid var(--line);font-size:min(2.8vw,3.2vh)}
li input{width:3.2vmin;height:3.2vmin;accent-color:var(--acc);flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--mute)}
li .x{background:none;color:var(--mute);font-size:min(3.4vw,4vh);padding:0 1vmin}
.empty{color:var(--mute);padding:2vmin 0;font-size:min(2.4vw,2.8vh)}
.clr{align-self:flex-start;background:none;color:var(--mute);font-size:min(1.9vw,2.2vh);margin-top:1vmin}
.big li{font-size:min(3.6vw,4.4vh);padding:2vmin 0}
textarea{flex:1;width:100%;resize:none;border:2px solid var(--line);border-radius:1.5vmin;background:var(--bg);color:var(--ink);font:inherit;font-size:min(3vw,3.6vh);padding:2vmin}
.tm{align-items:center;justify-content:center;text-align:center;gap:2.5vmin}
#tdisp{font-size:min(22vw,34vh);font-weight:300;line-height:1;letter-spacing:-.03em}
#tdisp.fin{color:var(--acc);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.row{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
.pill{background:var(--bg);color:var(--ink);border-radius:5vmin;padding:1.6vmin 3vmin;font-size:min(2.8vw,3.4vh)}
.pill.go{background:var(--acc);color:#fff}
nav{display:flex;gap:1.2vmin}
nav button{flex:1;background:var(--card);border-radius:1.8vmin;padding:1.4vmin .5vmin;font-size:min(2.4vw,2.8vh);color:var(--mute);box-shadow:0 1px 3px #0001}
nav button.on{background:var(--acc);color:#fff}
nav button.fs{flex:.5}
@media (orientation:portrait){
  #v-home{grid-template-columns:1fr;overflow:auto;grid-auto-rows:auto}
  #time{font-size:22vw}.w-ico{font-size:16vw}.w-temp{font-size:12vw}
  .cal .d{font-size:3.6vw}li{font-size:4vw}input[type=text]{font-size:4vw}
  #date,.w-desc,.day{font-size:3.4vw}h2{font-size:4.5vw}
  nav button{font-size:3.2vw}.pill{font-size:4vw}
}
</style>
</head>
<body>
<main>
  <section class="view on" id="v-home">
    <div class="card left">
      <div class="card"><div id="time">--:--</div><div id="date"></div></div>
      <div class="card">
        <div class="w-now"><div class="w-ico" id="wi">…</div>
          <div><div class="w-temp" id="wt">--°</div><div class="w-desc" id="wd">İstanbul · yükleniyor</div></div></div>
        <div class="days" id="wdays"></div>
      </div>
    </div>
    <div class="card"><h2 id="mon"></h2><div class="cal" id="cal"></div></div>
    <div class="card"><h2>Yapılacaklar</h2><div id="home-todos" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
  </section>

  <section class="view one" id="v-todo"><div class="card big"><h2>Yapılacaklar</h2><div id="big-todos" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div></section>
  <section class="view one" id="v-shop"><div class="card big"><h2>Alışveriş listesi</h2><div id="shop" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div></section>
  <section class="view one" id="v-note"><div class="card"><h2>Not defteri</h2><textarea id="note" placeholder="Buraya yaz, otomatik kaydedilir…"></textarea></div></section>
  <section class="view one" id="v-timer">
    <div class="card tm">
      <div id="tdisp">05:00</div>
      <div class="row" id="presets"></div>
      <div class="row"><button class="pill go" id="tgo">Başlat</button><button class="pill" id="trst">Sıfırla</button></div>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-v="home" class="on">🏠 Ana panel</button>
  <button data-v="todo">✅ Yapılacaklar</button>
  <button data-v="shop">🛒 Alışveriş</button>
  <button data-v="note">📝 Not</button>
  <button data-v="timer">⏱️ Zamanlayıcı</button>
  <button class="fs" id="fs">⛶</button>
</nav>

<script>
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");

/* ---- menü ---- */
let cur="home",idle=0;
function show(v){
  cur=v;
  document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
}
$("nav").onclick=e=>{const b=e.target.closest("button[data-v]");if(b)show(b.dataset.v)};
$("fs").onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d)};
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>idle=0));
setInterval(()=>{idle++;if(idle>=180&&cur!=="home"&&!timer.run)show("home")},1000); // 3 dk dokunulmazsa ana panele dön

/* ---- saat / takvim ---- */
function tick(){
  const n=new Date();
  $("time").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
  $("date").textContent=n.getDate()+" "+AYLAR[n.getMonth()]+" "+n.getFullYear()+", "+GUNLER[n.getDay()];
  if(tick.d!==n.getDate()){tick.d=n.getDate();drawCal(n)}
}
function drawCal(n){
  const y=n.getFullYear(),m=n.getMonth();
  $("mon").textContent=AYLAR[m]+" "+y;
  let h=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<div class="h">${x}</div>`).join("");
  const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){
    const d=i-first+1;
    if(d<1)h+=`<div class="d o">${prev+d}</div>`;
    else if(d>dim)h+=`<div class="d o">${d-dim}</div>`;
    else h+=`<div class="d${d===n.getDate()?" t":""}">${d}</div>`;
  }
  $("cal").innerHTML=h;
}

/* ---- hava durumu ---- */
function wc(c){
  if(c===0)return["☀️","Açık"];if(c<=2)return["🌤️","Parçalı bulutlu"];if(c===3)return["☁️","Kapalı"];
  if(c<=48)return["🌫️","Sisli"];if(c<=57)return["🌦️","Çise"];if(c<=67)return["🌧️","Yağmurlu"];
  if(c<=77)return["🌨️","Karlı"];if(c<=82)return["🌧️","Sağanak"];if(c<=86)return["🌨️","Kar sağanağı"];
  return["⛈️","Gök gürültülü"];
}
async function weather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=41.01&longitude=28.98&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FIstanbul&forecast_days=4");
    if(!r.ok)throw new Error("sunucu "+r.status);
    const j=await r.json();
    const [i,t]=wc(j.current.weather_code);
    $("wi").textContent=i;$("wt").textContent=Math.round(j.current.temperature_2m)+"°C";$("wd").textContent="İstanbul · "+t;
    $("wdays").innerHTML=j.daily.time.slice(1).map((d,k)=>{const q=k+1;
      return `<div class="day"><b>${GUNLER[new Date(d).getDay()].slice(0,3)}</b>${wc(j.daily.weather_code[q])[0]}<br>${Math.round(j.daily.temperature_2m_max[q])}° <span>${Math.round(j.daily.temperature_2m_min[q])}°</span></div>`}).join("");
  }catch(e){
    $("wd").textContent="İstanbul · hava durumu alınamadı ("+(e&&e.message?e.message:"hata")+"), 1 dk sonra tekrar denenecek";
    setTimeout(weather,60000);
  }
}

/* ---- listeler (aynı veriyi birden çok yerde gösterebilir) ---- */
const lists={};
function buildList(box,key,ph){
  const L=lists[key]||(lists[key]={items:(()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}})(),uls:[]});
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(L.items))}catch(e){}};
  const render=()=>L.uls.forEach(ul=>{
    ul.innerHTML="";
    if(!L.items.length){ul.innerHTML='<div class="empty">Henüz bir şey yok.</div>';return}
    L.items.forEach((t,i)=>{
      const li=document.createElement("li");if(t.done)li.className="done";
      const c=document.createElement("input");c.type="checkbox";c.checked=t.done;
      c.onchange=()=>{t.done=c.checked;save();render()};
      const s=document.createElement("span");s.textContent=t.text;
      const x=document.createElement("button");x.className="x";x.textContent="✕";
      x.onclick=()=>{L.items.splice(i,1);save();render()};
      li.append(c,s,x);ul.append(li);
    });
  });
  const f=document.createElement("form"),inp=document.createElement("input"),ab=document.createElement("button");
  inp.type="text";inp.placeholder=ph;inp.autocomplete="off";ab.className="add";ab.type="submit";ab.textContent="+";
  f.append(inp,ab);
  f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;L.items.push({text:v,done:false});inp.value="";save();render()};
  const ul=document.createElement("ul");L.uls.push(ul);
  const cb=document.createElement("button");cb.className="clr";cb.textContent="Tamamlananları temizle";
  cb.onclick=()=>{L.items=L.items.filter(t=>!t.done);save();render()};
  box.append(f,ul,cb);render();
}
buildList($("home-todos"),"todos","Yeni görev…");
buildList($("big-todos"),"todos","Yeni görev…");
buildList($("shop"),"shop","Alınacak şey…");

/* ---- not defteri ---- */
try{$("note").value=localStorage.getItem("note")||""}catch(e){}
$("note").oninput=()=>{try{localStorage.setItem("note",$("note").value)}catch(e){}};

/* ---- zamanlayıcı ---- */
const timer={set:300,left:300,run:false,end:0,iv:null};
function fmt(s){return pad(Math.floor(s/60))+":"+pad(s%60)}
function tShow(){$("tdisp").textContent=fmt(Math.max(0,Math.ceil(timer.left)))}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<6;i++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);
      const t=a.currentTime+i*.6;g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(0,t+.3);o.start(t);o.stop(t+.35)}}catch(e){}
}
function tStop(){timer.run=false;clearInterval(timer.iv);$("tgo").textContent="Başlat"}
function tSet(m){tStop();timer.set=timer.left=m*60;$("tdisp").classList.remove("fin");tShow()}
[1,5,10,15,30].forEach(m=>{const b=document.createElement("button");b.className="pill";b.textContent=m+" dk";b.onclick=()=>tSet(m);$("presets").append(b)});
$("tgo").onclick=()=>{
  if(timer.run){timer.left=(timer.end-Date.now())/1000;tStop();tShow();return}
  if(timer.left<=0)timer.left=timer.set;
  $("tdisp").classList.remove("fin");
  timer.run=true;timer.end=Date.now()+timer.left*1000;$("tgo").textContent="Duraklat";
  timer.iv=setInterval(()=>{
    timer.left=(timer.end-Date.now())/1000;tShow();
    if(timer.left<=0){tStop();timer.left=0;$("tdisp").classList.add("fin");beep();show("timer")}
  },250);
};
$("trst").onclick=()=>tSet(timer.set/60);
tShow();

/* ---- başlat ---- */
async function wake(){try{await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});
tick();setInterval(tick,1000);
weather();setInterval(weather,30*60*1000);
wake();
</script>
</body>
</html>
